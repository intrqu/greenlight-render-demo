worker_processes 1;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server {
        listen 10000;
        root /app/web;
        index index.html;
        location / {
            try_files $uri $uri/ =404;
        }
        location /reflector/ {
            proxy_pass http://127.0.0.1:9090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 120s;
        }
        location = /whiteboard/ { try_files /room-tools.html =404; }
        location = /pix/ { try_files /room-tools.html =404; }
        location = /youtube/ { try_files /youtube-room.html =404; }
        location ~ "^/files/apps/com\.hellojevans\.greenlight\.pictures/[A-Za-z0-9_-]{43}/data/[A-Za-z0-9_-]{43}$" {
            client_max_body_size 11m;
            proxy_pass http://127.0.0.1:9091;
        }
        location /files {
            return 404;
        }
    }
}
